name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Pinned (not ubuntu-latest): newer Ubuntu runner images (e.g. 26.04) no
    # longer have prebuilt Python 3.8/3.9 in actions/setup-python's cache,
    # which breaks the older end of the matrix below. ubuntu-22.04 still
    # has all of 3.8-3.12 available.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -v
