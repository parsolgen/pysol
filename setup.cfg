[metadata]
name = pysol
version = 0.1.0
description = Python DSL and compiler front-end for pysol: decorate Python functions with @pysol to generate .sol source, which the sgc compiler and a C++ backend turn into parallel/distributed simulation kernels (CPU and GOOPAX targets).

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.8
install_requires =

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest

[options.package_data]
pysol = *.sol
